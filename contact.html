<!DOCTYPE HTML>
<html>
<head>
    <title>Contact - Bekir Enes Siranli</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    <!-- Favicon -->
  <link rel="icon" href="assets/data-science.png" type="image/x-icon">
  
</head>
<body class="is-preload">

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Header -->
        <header id="header">
            <a href="index.html" class="logo">Portfolio</a>
        </header>

        <!-- Nav -->
        <nav id="nav">
            <ul class="links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li class="active"><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <!-- Main -->
        <div id="main">

            <section class="contact">
                <header class="major">
                    <h2>Contact Me</h2>
                    <p>If you have any questions or just want to say hello, feel free to reach out to me!</p>
                </header>

                <!-- Contact Form -->
                <form method="post" action="mailto:enes.siranli@hotmail.com">
                    <div class="fields">
                        <div class="field">
                            <label for="name">Your Name</label>
                            <input type="text" name="name" id="name" required />
                        </div>
                        <div class="field">
                            <label for="email">Your Email</label>
                            <input type="email" name="email" id="email" required />
                        </div>
                        <div class="field">
                            <label for="message">Message</label>
                            <textarea name="message" id="message" rows="3" required></textarea>
                        </div>
                    </div>
                    <ul class="actions">
                        <li><input type="submit" value="Send Message" /></li>
                    </ul>
                </form>

            </section>

            <!-- Location and Email -->
<section class="split contact">
    <section class="contact-info">
        <h3>Location</h3>
        <p>Istanbul, Turkey</p>
    </section>
    <section class="contact-info">
        <h3>Email</h3>
        <p><a href="mailto:enes.siranli@hotmail.com">enes.siranli@hotmail.com</a></p>
    </section>
</section>

<style>
    /* Styling for the Location and Email sections */
    .split.contact {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px; /* Adds space between the sections */
        margin-top: 30px; /* Adds space from the top */
    }

    .contact-info {
        flex: 1; /* Ensures both sections take up equal width */
        padding: 10px;
        text-align: left;
    }

    .contact-info h3 {
        margin-bottom: 10px; /* Adds space between heading and content */
    }

    .contact-info p {
        margin: 0;
    }
</style>


        </div>

        <!-- Footer -->
<footer id="footer">

</footer>

    #footer ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex; /* Aligns items horizontally */
        justify-content: space-between; /* Spaces the items apart */
        width: 100%; /* Ensures the footer takes full width */
    }

    #footer li {
        margin: 0;
    }
</style>
